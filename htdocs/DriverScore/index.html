<!-- Version 1.2 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveScore Pro - Telematics Tracker</title>
    <!-- External stylesheet reference for UI components and theme styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation link returning to root application dashboard -->
<a href="../" class="back-link">← Back to Apps</a>
<div class="container">
    <h1>DriveScore</h1>
    <!-- Link to navigate to garage settings page -->
    <a href="VehicleSettings.html" class="settings-link">Manage Vehicles Garage →</a>

    <!-- Driver and vehicle profile drop-down selector controls -->
    <div class="selector-row">
        <div>
            <label for="ddlDriver">Driver</label>
            <select id="ddlDriver"></select>
        </div>
        <div>
            <label for="ddlVehicle">Vehicle</label>
            <select id="ddlVehicle"></select>
        </div>
    </div>

    <!-- Checkbox control to request device screen wake lock -->
    <div class="toggle-row">
        <input type="checkbox" id="chkWakeLock" checked>
        <label for="chkWakeLock" style="display:inline; margin:0; cursor:pointer;">Keep Screen Awake During Trip</label>
    </div>
    
    <!-- Circular score gauge displaying current trip score with dynamic color gradient -->
    <div class="score-display" id="scoreCircle">
        <div class="score-value" id="lblScore">100</div>
        <div class="score-label" id="lblScoreType">Trip Score</div>
    </div>

    <!-- Live telematics data grid displaying filtered G-force, duration, speed, and locked phone position -->
    <div class="stats-grid">
        <div class="stat-card">
            <div>Filtered G-Force</div>
            <div class="stat-value" id="lblCurrentG">0.00g</div>
        </div>
        <div class="stat-card">
            <div>Duration</div>
            <div class="stat-value" id="lblDuration">00:00</div>
        </div>
        <div class="stat-card">
            <div>Speed</div>
            <div class="stat-value" id="lblSpeed">0.0 mph</div>
        </div>
        <div class="stat-card">
            <div>Phone Position</div>
            <div class="stat-value" id="lblPhonePosition">
                <span class="phone-position-badge" id="lblPhonePosBadge">
                    <span id="lblPhonePosIcon" class="phone-pos-icon">📱</span>
                    <span id="lblPhonePosText">Not Started</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Control buttons for starting/stopping drive tracking and clearing metrics -->
    <div class="controls">
        <button id="btnStart">Start Trip</button>
        <button id="btnReset" disabled>Reset</button>
    </div>

    <!-- Real-time operational console log window -->
    <div class="log" id="txtLog">System ready. Select profiles to begin.</div>
</div>

<script>
    // Primary tracking flag and telemetry state variables
    let isTracking = false;
    let score = 100.0;
    let maxG = 0.0;
    let startTime = null;
    let timerInterval = null;
    let watchPositionId = null;
    let wakeLock = null;
    let currentSpeedMph = 0.0;

    // Locked phone orientation state set at start of drive
    let phoneOrientationLocked = false;

    // Accelerometer signal filter running vectors and calibration offsets
    let filteredX = 0, filteredY = 0, filteredZ = 0;
    let calX = 0, calY = 0, calZ = 0;
    
    // Default vehicle sensitivity thresholds and score calculation parameters
    let activeThreshold = 0.32;
    let activeAlpha = 0.20;
    const REWARD_PER_SECOND = 0.03;  // Points per second credited during qualifying active-clean driving
    const PENALTY_MULTIPLIER = 5.0;

    // Penalty incident cooldown — 500ms so sustained hard events penalize every 0.5s
    const INCIDENT_COOLDOWN_MS = 500;
    let lastPenaltyTime = 0;

    // Bump (vertical) detection — logged for road condition awareness, not penalized
    const BUMP_THRESHOLD = 0.45;       // Minimum vertical G to count as a bump
    const BUMP_COOLDOWN_MS = 1000;     // Minimum interval between bump log entries
    let lastBumpTime = 0;

    // Active-clean driving reward tracking
    // Credit is only given when lateral/longitudinal movement is detected (active maneuvering)
    // but stays below the penalty threshold — not for flat straight-line driving
    const LATERAL_ACTIVE_MIN = 0.05;   // Minimum lateral G to consider maneuvering active
    const REWARD_WINDOW_SECONDS = 20;  // Accumulate this many qualifying seconds before awarding
    let activeCleanSeconds = 0;        // Seconds of below-threshold active maneuvering
    let hadPenaltyThisSecond = false;
    let wasActiveThisSecond = false;   // True if lateral/longitudinal G was above minimum this second

    // Persistent storage profile collections loaded from localStorage
    let driverProfiles = JSON.parse(localStorage.getItem('driver_profiles')) || {};
    let vehicleProfiles = JSON.parse(localStorage.getItem('vehicle_profiles')) || {};
    let currentDriverSelection = ""; 
    let currentVehicleSelection = "";

    // DOM element references
    const ddlDriver = document.getElementById('ddlDriver');
    const ddlVehicle = document.getElementById('ddlVehicle');
    const chkWakeLock = document.getElementById('chkWakeLock');
    const btnStart = document.getElementById('btnStart');
    const btnReset = document.getElementById('btnReset');
    const lblScore = document.getElementById('lblScore');
    const lblScoreType = document.getElementById('lblScoreType');
    const lblCurrentG = document.getElementById('lblCurrentG');
    const lblDuration = document.getElementById('lblDuration');
    const lblSpeed = document.getElementById('lblSpeed');
    const lblPhonePosIcon = document.getElementById('lblPhonePosIcon');
    const lblPhonePosText = document.getElementById('lblPhonePosText');
    const scoreCircle = document.getElementById('scoreCircle');
    const txtLog = document.getElementById('txtLog');

    // Populates driver selection dropdown from stored profiles
    function renderDriverDropdown() {
        ddlDriver.innerHTML = '';
        if (Object.keys(driverProfiles).length === 0) {
            ddlDriver.appendChild(new Option("-- Select Driver --", ""));
        }
        for (const [name, data] of Object.entries(driverProfiles)) {
            ddlDriver.appendChild(new Option(`${name} - ${Math.round(data.averageScore)}`, name));
        }
        ddlDriver.appendChild(new Option("add new...", "__ADD_NEW__"));
    }

    // Populates vehicle selection dropdown from stored profiles
    function renderVehicleDropdown() {
        ddlVehicle.innerHTML = '';
        if (Object.keys(vehicleProfiles).length === 0) {
            ddlVehicle.appendChild(new Option("-- Select Vehicle --", ""));
        }
        for (const [vName, config] of Object.entries(vehicleProfiles)) {
            ddlVehicle.appendChild(new Option(`${vName}`, vName));
        }
        ddlVehicle.appendChild(new Option("add/modify vehicle...", "__MANAGE_VEHICLES__"));
    }

    // Synchronizes active sensitivity thresholds when vehicle selection changes
    function updateActiveConfigurationUI() {
        if(ddlVehicle.value && vehicleProfiles[ddlVehicle.value]) {
            const current = vehicleProfiles[ddlVehicle.value];
            activeThreshold = current.threshold;
            activeAlpha = current.alpha;
        }
    }

    // Driver selection handler to add new driver profiles on demand
    ddlDriver.addEventListener('change', () => {
        if (ddlDriver.value === "__ADD_NEW__") {
            setTimeout(() => {
                const raw = prompt("Enter new driver's name:");
                const clean = raw ? raw.trim() : "";
                if (clean && clean !== "__ADD_NEW__" && !driverProfiles[clean]) {
                    driverProfiles[clean] = { totalDrives: 0, averageScore: 100 };
                    localStorage.setItem('driver_profiles', JSON.stringify(driverProfiles));
                    renderDriverDropdown();
                    ddlDriver.value = clean;
                } else {
                    ddlDriver.value = currentDriverSelection;
                }
                currentDriverSelection = ddlDriver.value;
            }, 10);
        } else {
            currentDriverSelection = ddlDriver.value;
        }
    });

    // Vehicle selection handler to trigger configuration updates or open garage settings
    ddlVehicle.addEventListener('change', () => {
        if (ddlVehicle.value === "__MANAGE_VEHICLES__") {
            window.location.href = "VehicleSettings.html";
        } else {
            currentVehicleSelection = ddlVehicle.value;
            updateActiveConfigurationUI();
        }
    });

    // Updates circular score display text, border, and dynamic HSL gradient fill
    function updateScoreUI() {
        const roundedScore = Math.max(0, Math.min(100, Math.round(score)));
        lblScore.textContent = roundedScore;
        const hue = (roundedScore / 100) * 120; 
        scoreCircle.style.background = `radial-gradient(circle, hsl(${hue}, 70%, 25%) 0%, hsl(${hue}, 80%, 15%) 100%)`;
        scoreCircle.style.border = `2px solid hsl(${hue}, 80%, 40%)`;
    }

    // Evaluates gravity vector at drive start to lock and display phone orientation position
    function detectAndLockPhonePosition(rawX, rawY, rawZ) {
        const absX = Math.abs(rawX);
        const absY = Math.abs(rawY);
        const absZ = Math.abs(rawZ);

        let desc = "Flat (Seat)";
        let icon = "📱";
        let cssClass = "pos-flat-up";
        let orientationName = "Flat on Seat";

        if (absZ > absX && absZ > absY) {
            if (rawZ < 0) {
                desc = "Flat (Down)";
                icon = "📱";
                cssClass = "pos-flat-down";
                orientationName = "Flat (Face Down)";
            } else {
                desc = "Flat (Seat)";
                icon = "📱";
                cssClass = "pos-flat-up";
                orientationName = "Flat on Seat (Face Up)";
            }
        } else if (absY > absX && absY > absZ) {
            if (rawY >= 0) {
                desc = "Mounted Vertical";
                icon = "📱⬆️";
                cssClass = "pos-portrait-up";
                orientationName = "Mounted Vertical (Portrait)";
            } else {
                desc = "Mounted Inverted";
                icon = "📱⬇️";
                cssClass = "pos-portrait-down";
                orientationName = "Mounted Inverted (Portrait)";
            }
        } else {
            if (rawX >= 0) {
                desc = "Mounted Landscape";
                icon = "📱➡️";
                cssClass = "pos-landscape-right";
                orientationName = "Mounted Landscape (Right)";
            } else {
                desc = "Mounted Landscape";
                icon = "📱⬅️";
                cssClass = "pos-landscape-left";
                orientationName = "Mounted Landscape (Left)";
            }
        }

        lblPhonePosText.textContent = desc;
        lblPhonePosIcon.textContent = icon;
        lblPhonePosIcon.className = `phone-pos-icon ${cssClass}`;
        phoneOrientationLocked = true;

        logMessage(`Phone position locked at start: ${orientationName}`);
    }

    // Prepends timestamped message entry to operational log box
    function logMessage(msg) {
        txtLog.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + txtLog.innerHTML;
    }

    // Requests screen wake lock to keep display active during trip tracking
    async function requestWakeLock() {
        if (!('wakeLock' in navigator)) return;
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            logMessage("Wake Lock active. Screen will stay awake.");
        } catch (err) {
            logMessage(`Wake Lock error: ${err.message}`);
        }
    }

    // Releases active screen wake lock
    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
    }

    // Re-requests wake lock when document visibility restores during active tracking
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible' && isTracking && chkWakeLock.checked) {
            await requestWakeLock();
        }
    });

    // Validates driver/vehicle selection and requests motion permissions before initializing sensors
    async function startEngine() {
        if (!ddlDriver.value || ddlDriver.value === "__ADD_NEW__" || !ddlVehicle.value || ddlVehicle.value === "__MANAGE_VEHICLES__") {
            alert("Ensure an active Driver and Vehicle are selected before starting a trip.");
            return;
        }

        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const permissionState = await DeviceMotionEvent.requestPermission();
                if (permissionState === 'granted') initSensors();
            } catch (e) { logMessage("Sensor Permission Denied: " + e); }
        } else {
            initSensors();
        }
    }

    // Initializes motion listeners, geolocation tracking, timers, and phone orientation lock
    async function initSensors() {
        isTracking = true;
        startTime = Date.now();
        lastPenaltyTime = 0; 
        cleanStreakSeconds = 0;
        hadPenaltyThisSecond = false;
        currentSpeedMph = 0.0;
        phoneOrientationLocked = false;

        lblPhonePosText.textContent = "Detecting...";

        if (chkWakeLock.checked) {
            await requestWakeLock();
        }

        btnStart.textContent = "Stop Trip";
        btnStart.classList.add('recording');
        btnReset.disabled = true;
        ddlDriver.disabled = true;
        ddlVehicle.disabled = true;
        chkWakeLock.disabled = true;

        filteredX = 0; filteredY = 0; filteredZ = 0;
        let isCalibrated = false;

        // Devicemotion event handler evaluating accelerometer and gravity vectors
        const motionHandler = (event) => {
            if (!isTracking) return;

            let rawX = event.acceleration?.x || 0;
            let rawY = event.acceleration?.y || 0;
            let rawZ = event.acceleration?.z || 0;

            let gravX = rawX, gravY = rawY, gravZ = rawZ;

            if (event.accelerationIncludingGravity) {
                gravX = event.accelerationIncludingGravity.x || 0;
                gravY = event.accelerationIncludingGravity.y || 0;
                gravZ = event.accelerationIncludingGravity.z || 0;
            }

            if (!event.acceleration && event.accelerationIncludingGravity) {
                rawX = gravX;
                rawY = gravY;
                rawZ = gravZ - 9.81;
            }

            // Lock initial phone position indicator on first sensor reading when drive starts
            if (!phoneOrientationLocked) {
                detectAndLockPhonePosition(gravX, gravY, gravZ);
            }

            if (!isCalibrated) {
                calX = rawX; calY = rawY; calZ = rawZ;
                isCalibrated = true;
                logMessage("Device orientation matrix zeroed.");
                return;
            }

            const cx = rawX - calX; const cy = rawY - calY; const cz = rawZ - calZ;

            filteredX = (activeAlpha * cx) + ((1 - activeAlpha) * filteredX);
            filteredY = (activeAlpha * cy) + ((1 - activeAlpha) * filteredY);
            filteredZ = (activeAlpha * cz) + ((1 - activeAlpha) * filteredZ);

            // Vertical G isolates Z-axis bump force from lateral combined total
            const verticalG = Math.abs(filteredZ) / 9.80665;

            // Lateral + longitudinal G for driver behavior scoring (excludes vertical bumps)
            const lateralAccel = Math.sqrt(filteredX*filteredX + filteredY*filteredY);
            const lateralG = lateralAccel / 9.80665;

            // Combined total G for display
            const totalAcceleration = Math.sqrt(filteredX*filteredX + filteredY*filteredY + filteredZ*filteredZ);
            const currentG = totalAcceleration / 9.80665;

            lblCurrentG.textContent = `${lateralG.toFixed(2)}g`;

            const now = Date.now();

            // Bump detection — vertical spikes are road condition, log only, no score impact
            if (verticalG > BUMP_THRESHOLD && currentSpeedMph > 0.5) {
                if (now - lastBumpTime > BUMP_COOLDOWN_MS) {
                    lastBumpTime = now;
                    logMessage(`Road: Bump detected (${verticalG.toFixed(2)}g vertical) — not penalized`);
                }
            }

            // Driver behavior scoring — lateral/longitudinal G only
            if (lateralG > activeThreshold && currentSpeedMph > 0.5) {
                hadPenaltyThisSecond = true;
                activeCleanSeconds = 0;  // Reset reward accumulator on any penalty event

                // Cooldown enforces minimum interval between penalty deductions (500ms)
                if (now - lastPenaltyTime > INCIDENT_COOLDOWN_MS) {
                    lastPenaltyTime = now;

                    const severity = lateralG - activeThreshold;
                    const deduction = severity * PENALTY_MULTIPLIER;
                    score = Math.max(0, score - deduction);
                    updateScoreUI();

                    const absX = Math.abs(filteredX), absY = Math.abs(filteredY);
                    let reason = "Hard Maneuver";
                    if (absX > absY) reason = "Hard Cornering";
                    else reason = (filteredY > 0) ? "Hard Braking" : "Hard Acceleration";

                    logMessage(`Penalty: -${deduction.toFixed(1)} pts (${lateralG.toFixed(2)}g lateral) ${reason}`);
                }
            } else if (lateralG >= LATERAL_ACTIVE_MIN && currentSpeedMph > 0.5) {
                // Below threshold but actively maneuvering — marks this second as reward-eligible
                wasActiveThisSecond = true;
            }
        };

        window.addEventListener('devicemotion', motionHandler, true);
        window.activeMotionHandler = motionHandler;

        // Geolocation listener tracking vehicle speed in miles per hour
        if ("geolocation" in navigator) {
            watchPositionId = navigator.geolocation.watchPosition(
                (pos) => {
                    currentSpeedMph = (pos.coords.speed !== null) ? pos.coords.speed * 2.23694 : 0.0;
                    lblSpeed.textContent = `${currentSpeedMph.toFixed(1)} mph`;
                },
                (err) => {}, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        // Interval timer updating drive duration and active-clean maneuvering rewards
        timerInterval = setInterval(() => {
            const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);

            const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
            const secs = String(elapsedSeconds % 60).padStart(2, '0');
            lblDuration.textContent = `${mins}:${secs}`;

            // Reward logic: only credit seconds where the driver was actively maneuvering
            // (lateral G above minimum) but stayed below the penalty threshold.
            // Straight-line freeway driving (wasActiveThisSecond = false) earns no credit.
            if (!hadPenaltyThisSecond && wasActiveThisSecond && currentSpeedMph > 0.5) {
                activeCleanSeconds++;
                if (activeCleanSeconds >= REWARD_WINDOW_SECONDS) {
                    activeCleanSeconds = 0;
                    if (score < 100.0) {
                        const addedPoints = REWARD_PER_SECOND * REWARD_WINDOW_SECONDS;
                        const previousScore = score;
                        score = Math.min(100.0, score + addedPoints);
                        updateScoreUI();

                        const realAdded = score - previousScore;
                        if (realAdded > 0.05) {
                            logMessage(`Reward: +${realAdded.toFixed(2)} pts for ${REWARD_WINDOW_SECONDS}s of controlled maneuvering.`);
                        }
                    }
                }
            }

            // Reset per-second flags for next interval
            hadPenaltyThisSecond = false;
            wasActiveThisSecond = false;
        }, 1000);
    }

    // Stops trip tracking, updates driver average score, and releases system locks
    function stopEngineExecution() {
        isTracking = false;
        releaseWakeLock();

        btnStart.textContent = "Start Trip";
        btnStart.classList.remove('recording');
        btnReset.disabled = false;
        ddlDriver.disabled = false;
        ddlVehicle.disabled = false;
        chkWakeLock.disabled = false;

        if (window.activeMotionHandler) {
            window.removeEventListener('devicemotion', window.activeMotionHandler, true);
        }
        if (watchPositionId !== null) navigator.geolocation.clearWatch(watchPositionId);
        clearInterval(timerInterval);

        const activeDriverName = ddlDriver.value;
        if (driverProfiles[activeDriverName]) {
            const p = driverProfiles[activeDriverName];
            p.averageScore = ((p.averageScore * p.totalDrives) + score) / (p.totalDrives + 1);
            p.totalDrives += 1;
            localStorage.setItem('driver_profiles', JSON.stringify(driverProfiles));
            renderDriverDropdown();
            ddlDriver.value = activeDriverName;
        }
        logMessage("Trip execution logged successfully.");
        updateScoreUI();
    }

    // Start/Stop button event binding
    btnStart.addEventListener('click', () => {
        if (!isTracking) startEngine();
        else stopEngineExecution();
    });

    // Reset button event binding resetting metrics, orientation state, and reward counters
    btnReset.addEventListener('click', () => {
        score = 100.0; maxG = 0.0;
        lblScore.textContent = "100";
        lblCurrentG.textContent = "0.00g";
        lblDuration.textContent = "00:00";
        lblSpeed.textContent = "0.0 mph";
        lblPhonePosText.textContent = "Not Started";
        lblPhonePosIcon.textContent = "📱";
        lblPhonePosIcon.className = "phone-pos-icon";
        phoneOrientationLocked = false;
        activeCleanSeconds = 0;
        hadPenaltyThisSecond = false;
        wasActiveThisSecond = false;
        lastPenaltyTime = 0;
        lastBumpTime = 0;
        btnReset.disabled = true;
        updateScoreUI();
        logMessage("Metrics cleared.");
    });

    // Initial page load initialization steps
    renderDriverDropdown();
    renderVehicleDropdown();
    currentDriverSelection = ddlDriver.value;
    if(ddlVehicle.options.length > 1) {
        ddlVehicle.selectedIndex = 0;
        currentVehicleSelection = ddlVehicle.value;
    }
    updateActiveConfigurationUI();
    updateScoreUI();
</script>
</body>
</html>
