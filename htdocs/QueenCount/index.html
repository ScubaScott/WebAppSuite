<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0a18" />
  <title>QueenCount</title>
  <!-- Shared Suite Header Stylesheet -->
  <link rel="stylesheet" href="../media/suite-header.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- Applies the saved theme before first paint -->
  <script src="theme.js"></script>
  <!-- Suite profile styles for footer sync indicator -->
  <link rel="stylesheet" href="../media/suite-profile.css" />
</head>
<body>

  <!-- Suite Header: back link, title, settings gear -->
  <header class="suite-header">
    <a href="../index.html" class="suite-header__back" aria-label="Back to Apps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span class="suite-header__back-label-long">Back to Apps</span>
      <span class="suite-header__back-label-short">Apps</span>
    </a>
    <h1 class="suite-header__title">QueenCount</h1>
    <button id="settingsGearBtn" class="suite-header__gear" type="button" aria-label="Open settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
      </svg>
    </button>
  </header>

  <main class="page">
    <!-- Storage / load error banner -->
    <p id="fatalMsg" class="entry-msg error" role="alert" hidden></p>

    <!-- Game header: date, entries, pot (or actual and pot when locked) -->
    <div id="gameHeader" class="game-header" hidden></div>

    <!-- Open game: pinned entry bar (add mode and edit mode share the same fields) -->
    <section id="entryBar" class="entry-bar" hidden>
      <div class="entry-fields">
        <input id="nameInput" type="text" maxlength="30" placeholder="Name" autocomplete="off" autocapitalize="words" aria-label="Name" />
        <input id="guessInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="Guess" autocomplete="off" aria-label="Guess" />
        <button id="addBtn" type="button" class="btn-primary">Add</button>
      </div>
      <div id="editActions" class="entry-actions" hidden>
        <button id="removeBtn" type="button" class="btn-danger">Remove</button>
        <button id="cancelEditBtn" type="button">Cancel</button>
      </div>
      <p id="entryMsg" class="entry-msg" aria-live="polite"></p>
    </section>

    <!-- Pool: shown when no game exists or a game is open -->
    <section id="poolCard" class="card" hidden>
      <div class="card-head">
        <h2>Pool</h2>
        <button id="editPoolBtn" type="button" class="btn-ghost">Edit pool</button>
      </div>
      <div id="poolAdd" class="pool-add" hidden>
        <input id="poolAddInput" type="text" maxlength="30" placeholder="Add name" autocomplete="off" autocapitalize="words" aria-label="Add name to pool" />
        <button id="poolAddBtn" type="button" class="btn-primary">Add</button>
      </div>
      <p id="poolMsg" class="entry-msg" aria-live="polite"></p>
      <div id="poolGrid" class="pool-grid"></div>
      <p id="poolEmpty" class="empty" hidden>Pool is empty — type a name above.</p>
    </section>

    <!-- No game: start a game -->
    <section id="noGame" hidden>
      <button id="newGameBtn" type="button" class="btn-primary btn-big">New game</button>
    </section>

    <!-- Open game: tonight's list and Enter actual -->
    <section id="openView" hidden>
      <div class="card">
        <div class="card-head">
          <h2>Tonight's list</h2>
          <span id="listCount" class="list-count"></span>
        </div>
        <ul id="guessList" class="row-list"></ul>
        <p id="listEmpty" class="empty">No guesses yet.</p>
      </div>
      <button id="enterActualBtn" type="button" class="btn-primary btn-big">Enter actual</button>
      <p id="needNote" class="need-note">Need at least 2 guesses</p>
    </section>

    <!-- Preview (not saved): sorted list showing the result; Back or Confirm & lock -->
    <section id="previewView" hidden>
      <div class="card"><ul id="previewList" class="row-list"></ul></div>
      <p class="warning-text">This can't be undone.</p>
      <p id="previewMsg" class="entry-msg" aria-live="polite"></p>
      <div class="modal-actions">
        <button id="backBtn" type="button">Back</button>
        <button id="confirmLockBtn" type="button" class="btn-primary">Confirm &amp; lock</button>
      </div>
    </section>

    <!-- Locked game: results -->
    <section id="lockedView" hidden>
      <div class="card"><ul id="resultList" class="row-list"></ul></div>
      <button id="newGameBtn2" type="button" class="btn-primary btn-big">New game</button>
    </section>

    <p class="link-row"><a href="history.html">History</a></p>
  </main>

  <!-- Modal host: actual entry, preview, confirmations and prompts -->
  <div id="overlay" class="overlay" hidden></div>

  <footer class="app-footer"><small>v<span id="appVersion">1.4</span></small></footer>

  <script src="../media/suite-profile.js"></script>
  <script src="qc-shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
