<!-- Version 1.2 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Number Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="tracking.js" defer></script>
</head>

<body>

    <header class="topbar">
        <div class="topbar-brand">
            <a href="../index.html" class="back-link">← Back to Apps</a>
            <h1>Bingo Number Tracker</h1>
        </div>
        <button id="newSessionBtn" class="btn primary-btn">New Session</button>
    </header>

    <main class="page-content">
        <section class="stats-card">
            <div class="last-five-card">
                <div class="stat-header">
                    <span class="stat-label">Last 6</span>
                    <button id="callLogLink" class="link-button" type="button">Call log</button>
                </div>
                <div id="lastFiveList" class="last-five-list" aria-live="polite"></div>
                <span class="total-count" id="totalCalled">0 called</span>
            </div>
        </section>

        <!-- Input mode toggle & Dauber color selector -->
        <div class="input-mode-toggle-wrap">
            <div class="input-mode-toggle" role="group" aria-label="Input mode">
                <button id="toggleByLetter" class="toggle-btn active" data-mode="letter">By Letter</button>
                <button id="toggleByNumber" class="toggle-btn" data-mode="number">By Number</button>
            </div>

            <div class="dauber-selector-wrap">
                <button id="dauberColorBtn" class="dauber-color-btn" type="button" aria-label="Dauber Settings" title="Dauber Color & Opacity" aria-expanded="false">
                    <span id="dauberColorPreview" class="dauber-color-preview"></span>
                </button>

                <div id="dauberMenuDropdown" class="dauber-menu-dropdown hidden">
                    <div class="dauber-menu-title">Dauber Color</div>
                    <div id="dauberPalette" class="dauber-palette"></div>
                    <div class="dauber-menu-divider"></div>
                    <div class="dauber-slider-section">
                        <div class="dauber-slider-header">
                            <span>Dauber Opacity</span>
                            <span id="opacityValueText">25%</span>
                        </div>
                        <input type="range" id="dauberOpacitySlider" min="0.10" max="1.00" step="0.05" value="0.25">
                    </div>
                </div>
            </div>
        </div>

        <!-- Session word bar (game name) -->
        <section id="sessionWordBar" class="session-word-bar" aria-label="Bingo columns"></section>

        <!-- BY LETTER input panel -->
        <section id="byLetterPanel" class="by-letter-panel" aria-label="By letter input">
            <div id="numberPicker" class="number-picker hidden" aria-live="polite">
                <!-- 3 rows × 5 numbers, populated by JS -->
            </div>
        </section>

        <!-- BY NUMBER tracking grid (existing) -->
        <section id="trackingGrid" class="tracking-grid hidden" aria-label="Bingo numbers"></section>

        <!-- Game Selection -->
        <section id="gameSection" class="game-section">
            <div class="game-section-header">
                <div class="game-menu-wrap">
                    <button id="gameMenuBtn" class="card-menu-btn" aria-label="Game menu" aria-expanded="false">
                        <span></span><span></span><span></span>
                    </button>
                    <div id="gameMenuDropdown" class="card-menu-dropdown hidden"></div>
                </div>
                <div class="game-info">
                    <span class="stat-label">Game Mode</span>
                    <div class="game-name-row">
                        <span id="selectedGameName" class="selected-game-name">— None selected —</span>
                        <!-- doubleModeBadge: shown when double mode is active -->
                        <span id="doubleModeBadge" class="double-mode-badge hidden">Double</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Bingo Cards -->
        <section id="bingoCardsSection" class="bingo-cards-section" aria-label="Bingo cards">
            <div class="bingo-cards-header">
                <span class="stat-label">Bingo Cards</span>
                <div class="cards-header-actions">
                    <button id="loadCardBtn" class="link-button" type="button">📥 Load Card</button>
                    <button id="addCardBtn" class="link-button" type="button">+ Add Card</button>
                </div>
            </div>
            <div id="bingoCardsList" class="bingo-cards-list">
                <!-- Cards will be rendered here -->
                <p class="bingo-cards-placeholder">No bingo cards added yet.</p>
            </div>
        </section>
    </main>

    <!-- ================================================
         FLOATING GEAR SETTINGS BUTTON (fixed, bottom-left)
    ================================================ -->
    <div style="position:fixed; left:16px; bottom:16px; z-index:900;">
        <button id="settingsGearBtn"
            style="width:48px; height:48px; border-radius:50%; background:var(--card); border:1px solid var(--border); color:var(--text-subtle); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 12px rgba(0,0,0,0.13); transition:transform 0.25s ease, box-shadow 0.2s ease, background 0.2s;"
            title="Settings" aria-label="Open settings">
            <!-- Gear SVG icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
            </svg>
        </button>
    </div>

    <!-- ================================================
         SETTINGS MODAL (theme picker)
    ================================================ -->
    <div id="settingsModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="settings-panel">
            <div class="settings-header">
                <h2 class="settings-title">
                    <!-- Gear icon in title -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="opacity:0.6;">
                        <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                    </svg>
                    Settings
                </h2>
                <button id="settingsCloseBtn" class="settings-close-btn" aria-label="Close settings">&times;</button>
            </div>

            <!-- Theme selector section -->
            <div class="settings-section">
                <div class="settings-section-label">Theme</div>
                <div class="theme-grid" id="themeGrid">
                    <!-- Basic theme card -->
                    <button class="theme-card" id="themeBasic" data-theme="basic" aria-pressed="true">
                        <div class="theme-preview theme-preview-basic">
                            <div class="tp-header"></div>
                            <div class="tp-cells">
                                <div class="tp-cell"></div><div class="tp-cell"></div><div class="tp-cell"></div>
                                <div class="tp-cell tp-daubed"></div><div class="tp-cell"></div><div class="tp-cell"></div>
                            </div>
                        </div>
                        <span class="theme-card-name">Basic</span>
                        <span class="theme-card-check" id="checkBasic">✓</span>
                    </button>

                    <!-- Dive Bar theme card -->
                    <button class="theme-card" id="themeDiveBar" data-theme="divebar" aria-pressed="false">
                        <div class="theme-preview theme-preview-divebar">
                            <div class="tp-header"></div>
                            <div class="tp-cells">
                                <div class="tp-cell"></div><div class="tp-cell"></div><div class="tp-cell"></div>
                                <div class="tp-cell tp-daubed"></div><div class="tp-cell"></div><div class="tp-cell"></div>
                            </div>
                        </div>
                        <span class="theme-card-name">Dive Bar</span>
                        <span class="theme-card-check hidden" id="checkDiveBar">✓</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
