<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farkle – Standings</title>
    <link rel="stylesheet" href="../media/suite-footer.css">
    <link rel="stylesheet" href="styles.css" />
    <!-- Suite profile styles for footer sync indicator -->
    <link rel="stylesheet" href="../media/suite-profile.css" />
  </head>
  <body data-page="standings">
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-brand">
          <p class="eyebrow">Wooden table edition</p>
          <h1>Farkle</h1>
        </div>
        <nav class="topnav">
          <a href="index.html">Game</a>
          <a href="players.html">Players</a>
          <a href="settings.html">Settings</a>
          <a href="standings.html" class="active">Standings</a>
        </nav>
      </header>

      <main class="page-content">
        <section class="card">
          <div class="card-heading">
            <h2>Current standings</h2>
            <p class="subtle">Ranked by total score.</p>
          </div>
          <div id="standingsList" class="standings-list"></div>
        </section>

        <!-- Line chart with one line per player -->
        <section class="card chart-card" aria-label="Score chart">
          <div class="card-heading">
            <h2>Scores by round</h2>
            <div class="seg" id="chartModeSeg" role="group" aria-label="Chart mode">
              <button type="button" data-mode="perRound" aria-pressed="true">Per round</button>
              <button type="button" data-mode="cumulative" aria-pressed="false">Total</button>
            </div>
          </div>
          <svg id="chart" class="chart" role="img" aria-label="Line chart of player scores by round"></svg>
          <ul id="legend" class="legend"></ul>
        </section>
      </main>
    </div>
    <!-- Suite profile cloud sync library for user preferences -->
    <script src="../media/suite-profile.js"></script>
    <script src="chart.js"></script>
    <script src="app.js"></script>
    <footer class="app-footer">
      <p>Version <span id="appVersion">1.3</span></p>
    </footer>
    <script>
      // Standings page version identifier
      const PAGE_VERSION = '1.3';
    </script>
  </body>
</html>
