<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ScoreBoard — Viewer</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Mobile-first base styles */
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #29395f 0%, #090d18 40%, #02040b 100%);
            color: #eef2ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            box-sizing: border-box;
        }

        .scoreboard {
            width: 100%;
            max-width: 980px;
            background: linear-gradient(180deg, rgba(17,24,39,0.96), rgba(15,23,42,0.98));
            border: 2px solid rgba(96,165,250,0.3);
            border-radius: 20px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.42);
            overflow: hidden;
            box-sizing: border-box;
        }

        .header-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 16px 16px 10px;
            gap: 12px;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .title {
            margin: 0;
            font-size: clamp(1.15rem, 4.5vw, 1.35rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .meta {
            margin: 0;
            color: #94a3b8;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .back-link {
            min-height: 44px;
            min-width: 44px;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(125,211,252,0.1);
            border: 1px solid rgba(125,211,252,0.25);
            transition: background 0.15s ease, border-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .back-link:hover {
            background: rgba(125,211,252,0.2);
            border-color: rgba(125,211,252,0.4);
        }

        .back-link:active {
            background: rgba(125,211,252,0.28);
        }

        /* Mobile arena stack */
        .court {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
            padding: 14px 16px 20px;
            box-sizing: border-box;
        }

        .center-panel {
            order: -1;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 12px;
            border-radius: 20px;
            background: radial-gradient(circle at top, rgba(59,130,246,0.18), rgba(15,23,42,0.92));
            border: 1px solid rgba(59,130,246,0.35);
        }

        .clock {
            font-family: 'Digital-7', monospace;
            font-size: clamp(2.8rem, 16vw, 3.8rem);
            letter-spacing: 0.05em;
            color: #f8fafc;
            text-shadow: 0 0 24px rgba(59,130,246,0.45);
            line-height: 1;
        }

        .period {
            font-size: 0.95rem;
            color: #c7d2fe;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .team-panel {
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            padding: 16px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(148,163,184,0.12);
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #a5b4fc;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .team-score {
            font-size: clamp(3.6rem, 16vw, 5rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            margin: 0;
            color: #f8fafc;
            line-height: 1.05;
        }

        .history-section {
            margin: 0 16px 16px;
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(148,163,184,0.14);
            border-radius: 20px;
            overflow: hidden;
        }

        .history-title {
            margin: 0;
            padding: 14px 16px;
            font-size: 0.92rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #e2e8f0;
            border-bottom: 1px solid rgba(148,163,184,0.1);
            background: rgba(15,23,42,0.9);
            font-weight: 700;
        }

        .history-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .history-item {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            align-items: flex-start;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .entry-label {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .entry-label strong {
            color: #f8fafc;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            word-break: break-word;
        }

        .entry-label span {
            color: #94a3b8;
            font-size: 0.84rem;
        }

        .entry-time {
            color: #94a3b8;
            font-size: 0.8rem;
            white-space: normal;
            text-align: left;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .status-live { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
        .status-paused { background: rgba(234,179,8,0.2); color: #facc15; border: 1px solid rgba(234,179,8,0.4); }
        .status-stalled { background: rgba(249,115,22,0.2); color: #fb923c; border: 1px solid rgba(249,115,22,0.4); }
        .status-final { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }

        .app-footer {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
        }

        /* Desktop progressive enhancement */
        @media (min-width: 720px) {
            body {
                padding: 24px 16px;
            }

            .scoreboard {
                border-radius: 32px;
                box-shadow: 0 24px 64px rgba(0,0,0,0.45);
            }

            .header-row {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 20px 24px 12px;
            }

            .header-nav {
                width: auto;
            }

            .court {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
                padding: 16px 24px 24px;
            }

            .center-panel {
                order: 0;
                width: 220px;
                padding: 18px 14px;
                border-radius: 24px;
            }

            .clock {
                font-size: clamp(3rem, 5vw, 4rem);
            }

            .period {
                font-size: 1rem;
            }

            .team-panel {
                flex: 1;
                padding: 18px 14px;
                border-radius: 22px;
            }

            .team-score {
                font-size: clamp(3.6rem, 7vw, 5.5rem);
            }

            .history-section {
                margin: 0 24px 24px;
                border-radius: 26px;
            }

            .history-title {
                padding: 16px 20px;
                font-size: 0.98rem;
            }

            .history-list {
                max-height: 360px;
            }

            .history-item {
                grid-template-columns: 1fr auto;
                gap: 12px;
                align-items: center;
                padding: 14px 20px;
            }

            .entry-time {
                white-space: nowrap;
                text-align: right;
                font-size: 0.82rem;
            }
        }
    </style>
</head>
<body>
<div class="scoreboard">
    <div class="header-row">
        <div class="header-info">
            <h1 class="title" id="title">Game Viewer</h1>
            <p class="meta" id="meta">Connecting to live feed…</p>
        </div>
        <div class="header-nav">
            <a class="back-link" href="ScoreBoardActiveGames.html">← Active Games</a>
            <a class="back-link" href="index.html">← ScoreBoard</a>
        </div>
    </div>
    <div class="court">
        <div class="team-panel">
            <div class="team-name" id="homeName">Home</div>
            <p class="team-score" id="homeScore">0</p>
        </div>
        <div class="center-panel">
            <div class="clock" id="timer">00:00.0</div>
            <div class="period" id="period">P1</div>
        </div>
        <div class="team-panel">
            <div class="team-name" id="awayName">Away</div>
            <p class="team-score" id="awayScore">0</p>
        </div>
    </div>
    <section class="history-section">
        <div class="history-title">Activity Log</div>
        <div class="history-list" id="historyList"></div>
    </section>
</div>

<!-- Shared Suite Profile and Games Client -->
<script src="../media/suite-profile.js"></script>

<script>
    // Extract query parameter helper
    function qs(name) { return new URLSearchParams(location.search).get(name); }
    const gameId = qs('id');

    // DOM element references
    const homeNameEl = document.getElementById('homeName');
    const awayNameEl = document.getElementById('awayName');
    const homeScoreEl = document.getElementById('homeScore');
    const awayScoreEl = document.getElementById('awayScore');
    const timerEl = document.getElementById('timer');
    const periodEl = document.getElementById('period');
    const titleEl = document.getElementById('title');
    const metaEl = document.getElementById('meta');
    const historyList = document.getElementById('historyList');

    let current = null;
    let tickInterval = null;
    let pollInterval = null;

    // Millisecond clock time formatter
    function formatTimeMs(ms) {
        const totalSeconds = Math.floor(Math.abs(ms) / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const tenths = Math.floor((Math.abs(ms) % 1000) / 100);
        return `${minutes}:${String(seconds).padStart(2,'0')}.${tenths}`;
    }

    // Relative age formatter
    function formatAgeMs(ms) {
        const seconds = Math.floor(ms / 1000);
        if (seconds < 10) return 'just now';
        if (seconds < 60) return `${seconds}s ago`;
        const minutes = Math.floor(seconds / 60);
        return `${minutes}m ago`;
    }

    // Render scoreboard presentation from current snapshot
    function render() {
        if (!current) return;

        // Team names and scores
        homeNameEl.textContent = current.homeTeamName || 'Home';
        awayNameEl.textContent = current.awayTeamName || 'Away';
        homeScoreEl.textContent = current.homeScore || 0;
        awayScoreEl.textContent = current.awayScore || 0;

        // Optional custom colors
        if (current.homeTeamColor) {
            homeNameEl.style.color = current.homeTeamColor;
            homeScoreEl.style.color = current.homeTeamColor;
        }
        if (current.awayTeamColor) {
            awayNameEl.style.color = current.awayTeamColor;
            awayScoreEl.style.color = current.awayTeamColor;
        }

        periodEl.textContent = `P${current.currentPeriod || 1}`;
        titleEl.textContent = `${homeNameEl.textContent} vs ${awayNameEl.textContent}`;

        renderMeta();
        renderHistory();
    }

    // Update status badge and age indicator
    function renderMeta() {
        if (!current) return;
        const now = Date.now();
        const effectiveAge = (current.age_ms || 0) + (now - (current.fetchTime || now));

        if (current.status === 'final') {
            metaEl.innerHTML = '<span class="status-badge status-final">Final</span> <span>Game concluded</span>';
        } else if (current.isPaused) {
            metaEl.innerHTML = `<span class="status-badge status-paused">Paused</span> <span>Last update ${formatAgeMs(effectiveAge)}</span>`;
        } else if ((current.age_ms || 0) >= 60000) {
            metaEl.innerHTML = `<span class="status-badge status-stalled">Stalled</span> <span>Last update ${formatAgeMs(effectiveAge)}</span>`;
        } else {
            metaEl.innerHTML = `<span class="status-badge status-live">Live</span> <span>Updated ${formatAgeMs(effectiveAge)}</span>`;
        }
    }

    // Render activity history log with penalty card and scoring distinctions
    function renderHistory() {
        historyList.innerHTML = '';
        const hist = Array.isArray(current.scoreHistory) ? current.scoreHistory.slice().reverse() : [];
        if (hist.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'history-item';
            empty.style.color = '#94a3b8';
            empty.textContent = 'No recorded events yet.';
            historyList.appendChild(empty);
            return;
        }

        hist.forEach(entry => {
            const item = document.createElement('div');
            item.className = 'history-item';

            const entryLabel = document.createElement('div');
            entryLabel.className = 'entry-label';
            const entryTitle = document.createElement('strong');
            const entrySub = document.createElement('span');

            if (entry.type === 'event') {
                entryTitle.textContent = entry.text || '';
                entrySub.textContent = entry.timestamp || entry.time || '';
            } else if (entry.type === 'card') {
                const isYellow = entry.cardType === 'yellow';
                const teamName = entry.teamName || (entry.teamId === 'home' ? (current.homeTeamName || 'Home') : (current.awayTeamName || 'Away'));
                const degreeLabel = entry.degree || (isYellow ? 'Yellow Card' : 'Red Card');
                entryTitle.textContent = `${isYellow ? '🟨' : '🟥'} ${teamName} — ${degreeLabel}`;
                entrySub.textContent = entry.gameTime || (entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '');
            } else {
                const teamName = entry.teamName || (entry.teamId === 'home' ? (current.homeTeamName || 'Home') : (current.awayTeamName || 'Away'));
                entryTitle.textContent = `${teamName} scored`;
                entrySub.textContent = `${entry.currentScore !== undefined ? entry.currentScore : ''} • ${entry.gameTime || (entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '')}`;
            }

            entryLabel.appendChild(entryTitle);
            if (entrySub.textContent) entryLabel.appendChild(entrySub);

            const timeEl = document.createElement('div');
            timeEl.className = 'entry-time';
            if (entry.timestamp) {
                timeEl.textContent = new Date(entry.timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            }

            item.appendChild(entryLabel);
            if (timeEl.textContent) item.appendChild(timeEl);
            historyList.appendChild(item);
        });
    }

    // High frequency ticker for skew-free smooth clock display
    function startTicker() {
        if (tickInterval) clearInterval(tickInterval);
        tickInterval = setInterval(() => {
            if (!current) return;
            const now = Date.now();
            let elapsed = Number(current.elapsedMs) || 0;
            const isLive = (current.status === 'live');
            const isStalled = isLive && (current.age_ms >= 60000);

            // Extrapolate time only when live, running, unpaused, and sync is active (< 60s age)
            if (isLive && current.timerRunning && !current.isPaused && !isStalled) {
                const timeSinceFetch = Math.max(0, now - (current.fetchTime || now));
                elapsed += (current.age_ms || 0) + timeSinceFetch;
            }

            let displayMs = elapsed;
            if (current.isCountingUp === false && current.timeLimit > 0) {
                displayMs = Math.max(0, current.timeLimit - elapsed);
            }

            timerEl.textContent = formatTimeMs(displayMs);
            renderMeta();
        }, 100);
    }

    // Fetch latest game snapshot from API
    async function loadGame() {
        if (!gameId) {
            document.body.innerHTML = '<div style="padding:24px; color:#fff; text-align:center;"><h2>Missing Game ID</h2><p><a href="ScoreBoardActiveGames.html" style="color:#7dd3fc;">← View Active Games</a></p></div>';
            return;
        }

        try {
            let res = null;
            if (window.SuiteProfile && SuiteProfile.games) {
                res = await SuiteProfile.games.get(gameId);
            } else {
                const fetchRes = await fetch(`../api/games.php?action=get&id=${encodeURIComponent(gameId)}`);
                res = await fetchRes.json();
            }

            if (!res || !res.success || !res.game) {
                if (!current) {
                    document.body.innerHTML = '<div style="padding:24px; color:#fff; text-align:center;"><h2>Game Not Found</h2><p>This game may be private, expired, or removed.</p><p><a href="ScoreBoardActiveGames.html" style="color:#7dd3fc;">← View Active Games</a></p></div>';
                }
                return;
            }

            const game = res.game;
            const snap = game.snapshot || game;

            current = {
                ...game,
                ...snap,
                status: game.status,
                age_ms: typeof res.age_ms === 'number' ? res.age_ms : (typeof game.age_ms === 'number' ? game.age_ms : 0),
                fetchTime: Date.now(),
                ended_by: game.ended_by
            };

            render();
            startTicker();

            // Stop polling when game is final
            if (current.status === 'final' && pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        } catch (e) {
            // Keep existing display if temporary fetch error occurs
        }
    }

    // Viewer tool version identifier
    const VERSION = '1.3';
    const APP_VERSION = VERSION;

    window.addEventListener('DOMContentLoaded', () => {
        const versionEl = document.getElementById('viewerVersion');
        if (versionEl) versionEl.textContent = VERSION;
    });

    // Start polling and load initial state
    pollInterval = setInterval(loadGame, 4000);
    loadGame();
</script>

<footer class="app-footer">
    <p>Version <span id="viewerVersion">1.3</span></p>
</footer>
</body>
</html>
